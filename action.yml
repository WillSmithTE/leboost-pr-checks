name: Usero PR checks
description: Lab web vitals and server time for every pull request. Loads the PR preview and main back to back and comments only on changes past the noise.
author: Usero
branding:
  icon: activity
  color: orange

inputs:
  head-url:
    description: URL of this pull request's preview deployment.
    required: true
  base-url:
    description: URL to compare against, usually the preview of your main branch. Comments call it "main".
    required: true
  prod-url:
    description: Optional production URL, shown next to the result for reference. It never changes the verdict.
    required: false
    default: ''
  paths:
    description: Pages to measure, appended to each URL. One per line, or separated by spaces or commas.
    required: false
    default: /
  prod-paths:
    description: Which of paths also load prod-url, in the same format. Empty means every path. Leave out a page that does not exist on production, such as one seeded only on previews.
    required: false
    default: ''
  rounds:
    description: Rounds per page. Each round loads main and the PR once. 3 to 50. Each extra round adds two page loads per path.
    required: false
    default: '8'
  server-samples:
    description: Server time requests per side and path, 10 to 200, or 0 to turn server time off. Plain GETs on warm connections, a few seconds in all.
    required: false
    default: '30'
  device:
    description: mobile (Lighthouse's Slow 4G and 4x CPU profile) or desktop.
    required: false
    default: mobile
  interact:
    description: 'Optional INP measurement: one "PATH::SELECTOR" per line. The element is clicked after load on that path. The click must not navigate away.'
    required: false
    default: ''
  headers:
    description: 'Extra request headers, one "Name: value" per line, sent only to the head, base and prod sites. For example a Vercel protection bypass.'
    required: false
    default: ''
  github-token:
    description: Token used to find the pull request, post the comment and read past runs for the trend chart. Needs pull-requests write to comment and actions read for the chart.
    required: false
    default: ${{ github.token }}
  comment:
    description: Post or update one comment on the pull request.
    required: false
    default: 'true'
  pr-number:
    description: Pull request to comment on. Found automatically from the event or the commit; set it for workflow_dispatch and similar.
    required: false
    default: ''
  fail-on-regression:
    description: Fail the job when anything regressed. Off by default, the check only reports.
    required: false
    default: 'false'
  base-bundle-bytes:
    description: Optional size in bytes of main's server bundle (what a cold start loads), shown next to head-bundle-bytes. Never judged.
    required: false
    default: ''
  head-bundle-bytes:
    description: Optional size in bytes of this PR's server bundle.
    required: false
    default: ''
  chart-base-url:
    description: Where the trend chart images are drawn. Only for testing a chart server.
    required: false
    default: https://usero.io/pr-checks/chart.png

outputs:
  regressions:
    description: Number of significant regressions vs main.
  improvements:
    description: Number of significant improvements vs main.
  json-path:
    description: Path of vitals.json, every raw sample plus the summary. The action also saves it as a workflow artifact for the trend chart.

runs:
  using: node24
  main: dist/index.js
